<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add court - ONFOOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="add-court.css">
</head>
<body>

    <div class="app">

        <aside class="sidebar">
            <span class="logo logo-desktop">ONFOOT Admin</span>
            <nav class="nav">
                <a href="admin-dashboard.html"><i class="bi bi-grid"></i><span>Dashboard</span></a>
                <a href="add-court.html" class="active"><i class="bi bi-record-circle"></i><span>Courts</span></a>
                <a href="#"><i class="bi bi-calendar3"></i><span>Bookings</span></a>
                <a href="#"><i class="bi bi-person"></i><span><span class="only-mobile">Profile</span><span class="only-desktop">Players</span></span></a>
                <a href="#"><i class="bi bi-sliders"></i><span>Settings</span></a>
            </nav>
        </aside>

        <div class="main">

            <header class="topbar">
                <span class="logo logo-mobile">ONFOOT Admin</span>
                <i class="bi bi-bell bell"></i>
            </header>

            <main class="content">
                <a href="admin-dashboard.html" class="back only-mobile"><i class="bi bi-chevron-left"></i> Add court</a>
                <p class="crumbs only-desktop"><a href="admin-dashboard.html">Courts</a> &gt; Add court</p>
                <h2 class="page-title only-desktop">Add court</h2>

                <form action="admin-dashboard.html" class="court-form">

                    <div class="form-grid">
                        <div class="photo">
                            <p class="photo-label only-desktop">Court photo</p>
                            <img src="https://placehold.co/600x250?text=Court+photo" alt="Court photo">
                        </div>

                        <div class="fields">
                            <div class="field">
                                <label for="name">Court Name</label>
                                <input type="text" id="name" value="Gems Futsal">
                            </div>
                            <div class="field">
                                <label for="location">Location</label>
                                <input type="text" id="location" value="Satdobato">
                            </div>
                            <div class="field">
                                <label for="price">Price per hour</label>
                                <input type="text" id="price" value="Rs. 1,500">
                            </div>
                            <div class="time-row">
                                <div class="field">
                                    <label for="opens">Opens</label>
                                    <select id="opens"><option>6:00 AM</option><option>7:00 AM</option></select>
                                </div>
                                <div class="field">
                                    <label for="closes">Closes</label>
                                    <select id="closes"><option>8:00 PM</option><option>9:00 PM</option></select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="actions">
                        <a href="admin-dashboard.html" class="btn-outline">Cancel</a>
                        <button type="submit" class="btn-primary">Save court</button>
                    </div>

                </form>
            </main>

        </div>
    </div>

</body>
</html>
