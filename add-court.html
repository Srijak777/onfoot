<!DOCTYPE html>
<html>
    <head>
        <title>Add court - ONFOOT</title>
    </head>
    <body>
        <h1>ONFOOT Admin</h1>
        <span>Notifications</span>
        <main>
            <a href="admin-dashboard.html">Add court</a>
            <img src="https://placehold.co/340x96" alt="Court photo">
            <form action="admin-dashboard.html">
             <label for="name">Court Name</label>
            <input type="text" id="name" value="Gems Futsal">

            <label for="location">Location</label>
            <input type="text" id="location" value="Satdobato">

            <label for="price">Price per hour</label>
            <input type="text" id="price" value="Rs. 1,500">

             <label for="opens">Opens</label>
            <select id="opens">
            <option>6:00 AM</option>
            <option>7:00 AM</option>
      </select>

            <label for="closes">Closes</label>
      <select id="closes">
            <option>8:00 PM</option>
            <option>9:00 PM</option>
      </select>

            <a href="admin-dashboard.html">Cancel</a>
            <button type="submit">Save court</button>   
            </form>
        </main>
        <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="#">Courts</a>
        <a href="#">Bookings</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
     </nav>
    </body>
</html>
